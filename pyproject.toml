[project]
name = "chunking"
version = "0.1.0"
description = "PDF chunking and retrieval evaluation pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mineru>=4.0,<5",
    "docling[onnxruntime,vlm]==2.138.0",
    "pymupdf>=1.28.2",
    "langchain-groq>=1.1,<2",
    "langchain-huggingface>=1.1,<2",
    "sentence-transformers>=3,<6",
]

[project.scripts]
chunking = "chunking.cli:main"
chunking-rag-eval = "chunking.eval_cli:main"
chunking-ocr-eval = "chunking.ocr_eval_cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
